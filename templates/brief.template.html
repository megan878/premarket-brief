<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Market Swing Brief</title>
<style>
/* ── Tokens (light / dark). Chart colors follow the dataviz palette: blue↔red diverging, gray midpoint. ── */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --pos: #2a78d6;       /* diverging: up / strong */
  --neg: #e34948;       /* diverging: down / weak */
  --mid: #f0efec;
  --good-text: #006300;
  --warn: #fab219;
  --warn-bg: #fff6e0;
  --warn-ink: #6b4a00;
  --crit: #d03b3b;
  --chip: #efeeea;
  --acc-tech: #2a78d6; --acc-cat: #4a3aa7; --on-acc: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --pos: #3987e5; --neg: #e66767; --mid: #383835; --good-text: #0ca30c;
    --warn-bg: #2a2410; --warn-ink: #f3d68a; --crit: #ec6a6a; --chip: #262624; --acc-tech: #3987e5; --acc-cat: #9085e9; --on-acc: #0d0d0d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --pos: #3987e5; --neg: #e66767; --mid: #383835; --good-text: #0ca30c;
  --warn-bg: #2a2410; --warn-ink: #f3d68a; --crit: #ec6a6a; --chip: #262624; --acc-tech: #3987e5; --acc-cat: #9085e9; --on-acc: #0d0d0d;
}

* { box-sizing: border-box; }
html { background: var(--page); }
body {
  margin: 0; padding: 24px 16px 48px; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; }

/* ── Shell: header, section, card ── */
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 16px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.top .meta { color: var(--ink-2); font-size: 13px; }
.meta b { color: var(--ink); font-weight: 600; }
.section { margin-top: 28px; }
.section > h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.section > h2 .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--surface); font-size: 12px; letter-spacing: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
.card .sub { margin: 0 0 12px; color: var(--ink-2); font-size: 12.5px; }
.grid { display: grid; gap: 12px; }
.g-strip { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g-two { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); align-items: start; }
@media (max-width: 900px) { .g-strip { grid-template-columns: repeat(2, minmax(0,1fr)); } .g-two { grid-template-columns: 1fr; } }

/* ── Notice banner ── */
.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); font-size: 13px; }
.notice svg { flex: none; margin-top: 1px; }
.notice ul { margin: 4px 0 0; padding-left: 18px; }
.notice li { margin: 2px 0; }

/* ── Index tile ── */
.tile { position: relative; }
.tile .sym { font-size: 12px; font-weight: 650; color: var(--ink-2); letter-spacing: .04em; }
.tile .val { margin: 4px 0 2px; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; }
.tile .chg { font-size: 13px; font-weight: 600; }
.up { color: var(--pos); } .dn { color: var(--neg); }
.tile .chg .arr { margin-right: 2px; }
.tile.na .val { color: var(--ink-3); font-size: 20px; }
.rng { margin-top: 12px; }
.rng .bar { position: relative; height: 4px; border-radius: 2px; background: var(--grid); }
.rng .dot { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface); transform: translate(-50%,-50%); }
.rng .lbl { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.chip { padding: 2px 7px; border-radius: 999px; background: var(--chip); font-size: 11px; color: var(--ink-2); }
.chip b { font-weight: 650; }

/* ── Regime ── */
.regime { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 15px; background: var(--chip); }
.badge.on { color: var(--good-text); }
.badge.off { color: var(--crit); }
.badge.mixed { color: var(--warn-ink); }
.score { font-size: 12.5px; color: var(--ink-2); }
.checks { margin: 14px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
@media (max-width: 600px) { .checks { grid-template-columns: 1fr; } }
.checks li { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--ink-2); }
.checks .ic { flex: none; width: 14px; text-align: center; font-weight: 700; }
.checks .pass .ic { color: var(--good-text); } .checks .fail .ic { color: var(--crit); }
.checks li b { color: var(--ink); font-weight: 600; }

/* ── Sector bars ── */
.sec-row { display: grid; grid-template-columns: 22px 168px minmax(0,1fr) 56px; align-items: center; gap: 8px; height: 30px; }
.sec-row .rk { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; color: var(--ink-3); }
.sec-row.top3 .rk { background: var(--ink); color: var(--surface); font-weight: 700; }
.sec-row .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-row.top3 .nm { font-weight: 650; }
.sec-row .short { display: none; }
.sec-row .track { position: relative; height: 16px; }
.sec-row .zero { position: absolute; left: var(--zero); top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.sec-row .fill { position: absolute; top: 4px; height: 8px; }
.sec-row .fill.p { left: var(--zero); background: var(--pos); border-radius: 0 4px 4px 0; }
.sec-row .fill.n { right: calc(100% - var(--zero)); background: var(--neg); border-radius: 4px 0 0 4px; }
.sec-row:not(.top3) .fill { opacity: .45; }
.sec-row .mk { position: absolute; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--ink-2); transform: translateX(-50%); }
.sec-row .mk.ny { border-radius: 1px; transform: translateX(-50%) rotate(45deg); }
.sec-row .v { font-size: 13px; font-weight: 600; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 11.5px; color: var(--ink-2); }
.legend .k { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: baseline; }
.legend .k.c { border: 1.5px solid var(--ink-2); border-radius: 50%; background: var(--surface); }
.legend .k.d { border: 1.5px solid var(--ink-2); background: var(--surface); transform: rotate(45deg); width: 7px; height: 7px; }
.legend .k.b { background: var(--pos); border-radius: 2px; }
.tag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em; background: var(--ink); color: var(--surface); vertical-align: 1px; }
@media (max-width: 520px) { .sec-row { grid-template-columns: 20px 118px minmax(0,1fr) 50px; } .sec-row .full { display: none; } .sec-row .short { display: inline; } }

/* ── Industry universe (shell) ── */
.ind-col + .ind-col { margin-top: 12px; }
.ind-col h4 { margin: 0 0 6px; font-size: 12.5px; font-weight: 650; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.slot { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; justify-content: center; padding: 6px 8px; border: 1px dashed var(--axis); border-radius: 6px; font-size: 12px; color: var(--ink-3); min-height: 30px; }
.slot .in { font-weight: 600; line-height: 1.25; }
.slot .pl { display: flex; gap: 6px; align-items: baseline; font-size: 11.5px; color: var(--ink-3); }
.slot .pl i { font-style: normal; }
.slot.filled { border-style: solid; border-color: var(--border); color: var(--ink); background: var(--chip); }
.slot .p { margin-left: auto; font-weight: 600; }
@media (max-width: 520px) { .slots { grid-template-columns: 1fr 1fr; } }
.blocked { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--chip); font-size: 12.5px; color: var(--ink-2); }


/* ── Picks ── */
.cov { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 0; padding: 0; list-style: none; }
.cov li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.cov .st { font-weight: 700; text-align: center; }
.cov .ok { color: var(--good-text); } .cov .px { color: var(--warn-ink); } .cov .no { color: var(--crit); }
.cov b { color: var(--ink); font-weight: 600; }
.picks { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 900px) { .picks { grid-template-columns: 1fr; } }
.pick .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.pick .tk { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.pick .co { margin-left: 8px; color: var(--ink-2); font-size: 13px; }
.pick .ind { font-size: 11.5px; color: var(--ink-2); background: var(--chip); border-radius: 999px; padding: 2px 8px; }
.pick .setup { margin-top: 6px; font-size: 12.5px; }
.pick .setup b { font-weight: 650; }
.pick .setup span { color: var(--ink-3); }
.pick svg.spark { display: block; width: 100%; height: 84px; margin: 10px 0 4px; }
.spark .ln { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.spark .pv { stroke: var(--pos); stroke-width: 1; stroke-dasharray: 3 3; }
.spark .sp { stroke: var(--neg); stroke-width: 1; stroke-dasharray: 3 3; }
.spark text { font-size: 9px; fill: var(--ink-3); }
.spark .dot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.lv { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 10px; }
@media (max-width: 520px) { .lv { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.lv > div { background: var(--chip); border-radius: 8px; padding: 8px 10px; }
.lv .k { display: block; font-size: 11px; color: var(--ink-3); }
.lv .v { display: block; font-size: 15px; font-weight: 650; margin-top: 1px; }
.lv .s { display: block; font-size: 11px; color: var(--ink-2); margin-top: 1px; }
.lv .stop .v { color: var(--neg); } .lv .tgt .v { color: var(--pos); }
.pick .why { margin: 10px 0 0; font-size: 13px; }
.pick .trim { margin: 4px 0 0; font-size: 12px; color: var(--ink-2); }
.pick .chk { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.pick .chk .chip.ok::before { content: "✓ "; color: var(--good-text); font-weight: 700; }
.pick .chk .chip.px::before { content: "~ "; color: var(--warn-ink); font-weight: 700; }
.pick .chk .chip.no::before { content: "? "; color: var(--crit); font-weight: 700; }


/* ── Readiness score ── */
.readiness { display: flex; align-items: center; gap: 14px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip); flex-wrap: wrap; }
.readiness .score { display: flex; align-items: baseline; gap: 4px; }
.readiness .num { font-size: 22px; font-weight: 750; letter-spacing: -0.01em; }
.readiness .num.ok { color: var(--good-text); } .readiness .num.px { color: var(--warn-ink); } .readiness .num.no { color: var(--crit); }
.readiness .of100 { font-size: 11px; color: var(--ink-3); }
.readiness .bd { display: flex; gap: 10px; flex-wrap: wrap; }
.readiness .bdi { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--ink-3); line-height: 1.3; cursor: help; }
.readiness .bdi b { font-size: 13px; color: var(--ink); font-weight: 650; }
.readiness .bdi i { font-style: normal; text-transform: uppercase; letter-spacing: .03em; }

/* ── Catalyst vs technical accents ── */
.kind { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--on-acc); }
.kind.tech { background: var(--acc-tech); }
.kind.cat { background: var(--acc-cat); }
.pick.tech { border-top: 3px solid var(--acc-tech); }
.pick.cat { border-top: 3px solid var(--acc-cat); }
.pick .tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sub-h { display: flex; align-items: center; gap: 8px; margin: 22px 0 0; font-size: 13.5px; font-weight: 650; }
.sub-h:first-of-type { margin-top: 12px; }
.catbox { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--chip); border-left: 3px solid var(--acc-cat); }
.catbox .ct { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12px; color: var(--ink-2); }
.catbox .ct b { color: var(--ink); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
.catbox p { margin: 4px 0 0; font-size: 13px; }
.catbox .src { margin-top: 6px; font-size: 11.5px; color: var(--ink-3); }
.catbox .src a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
.spark .cm { stroke: var(--acc-cat); stroke-width: 1; stroke-dasharray: 2 3; }
.spark .en { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.spark .cmt { fill: var(--acc-cat); }
.pick .note { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-2); }
.pick .note b { color: var(--ink); font-weight: 600; }
details.rej { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
details.rej summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.rej ul { margin: 6px 0 0; padding-left: 18px; }
details.rej li { margin: 2px 0; }


/* ── Rates line, background strip, watchlist ── */
.macro { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--chip); border-left: 3px solid var(--warn); font-size: 12.5px; color: var(--ink-2); }
.macro b { color: var(--ink); font-weight: 650; }
.macro .msrc { display: block; margin-top: 4px; font-size: 11.5px; color: var(--ink-3); }
.macro a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
.bg { margin-top: 10px; }
.bg .what { margin: 0 0 8px; font-size: 13px; color: var(--ink); }
.bgs { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
@media (max-width: 520px) { .bgs { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.bgs > div { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.bgs .k { display: block; font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.bgs .v { display: block; font-size: 13.5px; font-weight: 650; margin-top: 1px; }
.bgs .v i { font-style: normal; font-size: 11px; font-weight: 600; margin-left: 4px; }
.bgs .s { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; line-height: 1.3; }
.bgs .warn { border-color: var(--warn); background: var(--warn-bg); }
.bgs .warn .s { color: var(--warn-ink); font-weight: 600; }
.bg .deal { margin: 8px 0 0; padding: 0 0 0 16px; font-size: 12px; color: var(--ink-2); }
.bg .deal li { margin: 1px 0; }
.pick.cat .bg .deal { border-left: 0; }
.wl-row { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 8px 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
.wl-row:first-of-type { border-top: 0; padding-top: 0; }
@media (max-width: 700px) { .wl-row { grid-template-columns: 1fr; } }
.wl-h { font-size: 12.5px; font-weight: 650; color: var(--ink-2); padding-top: 6px; }
.wl-items { display: flex; flex-wrap: wrap; gap: 8px; }
.wi { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--chip); color: var(--ink); text-decoration: none; font-size: 13px; }
a.wi:hover { border-color: var(--ink-3); }
.wi b { font-weight: 700; }
.wi .px { color: var(--ink-2); }
.wi .pc { font-weight: 650; font-size: 12.5px; }
.wi .fl { font-size: 10.5px; font-weight: 700; color: var(--warn-ink); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; }
.wi.nm { flex-direction: column; align-items: flex-start; gap: 3px; flex: 1 1 260px; }
.wi.nm .top { display: flex; gap: 8px; align-items: baseline; }
.wi.nm small { font-size: 11.5px; color: var(--ink-3); }
.wl-note { margin: 10px 0 0; font-size: 11.5px; color: var(--ink-3); }


/* ── Catalyst playbook (static reference) ── */
.playbook { margin-top: 0; }
.playbook summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 650; }
.playbook summary::-webkit-details-marker { display: none; }
.playbook summary::before { content: '▸'; display: inline-block; transition: transform .15s; color: var(--ink-3); font-weight: 700; }
.playbook[open] summary::before { transform: rotate(90deg); }
.playbook[open] summary { border-radius: 12px 12px 0 0; border-bottom-color: transparent; }
.playbook summary .hint { font-weight: 500; font-size: 12.5px; color: var(--ink-3); }
.pb-body { padding: 18px 16px; border: 1px solid var(--border); border-top: 0; border-radius: 0 0 12px 12px; background: var(--surface); display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px 22px; }
@media (max-width: 900px) { .pb-body { grid-template-columns: 1fr; } }
.pb-col h4 { margin: 0 0 10px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.pb-types { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.pb-types li { font-size: 13px; padding-left: 16px; position: relative; line-height: 1.4; }
.pb-types li::before { content: '•'; position: absolute; left: 2px; color: var(--acc-cat); font-weight: 700; }
.pb-rule { display: flex; gap: 10px; margin-bottom: 12px; font-size: 12.5px; line-height: 1.45; }
.pb-rule:last-child { margin-bottom: 0; }
.pb-ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }
.pb-ic.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pb-ic.ok { background: color-mix(in srgb, var(--good-text) 16%, transparent); color: var(--good-text); }
.pb-ic.crit { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit); }
.pb-sizing { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.pb-sizing td { padding: 7px 0; border-top: 1px solid var(--grid); vertical-align: top; line-height: 1.4; }
.pb-sizing tr:first-child td { border-top: 0; }
.pb-sz { font-weight: 700; white-space: nowrap; padding-right: 10px !important; }
.pb-sz.full { color: var(--good-text); } .pb-sz.half { color: var(--warn-ink); }

/* ── Pick tracker ── */
.trk { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .02em; background: var(--chip); color: var(--ink-2); border: 1px solid var(--border); white-space: nowrap; }
.trk .r { font-weight: 750; font-variant-numeric: tabular-nums; }
.trk.live { color: var(--pos); background: color-mix(in srgb, var(--pos) 12%, transparent); border-color: color-mix(in srgb, var(--pos) 40%, transparent); }
.trk.target { color: var(--good-text); background: color-mix(in srgb, var(--good-text) 14%, transparent); border-color: color-mix(in srgb, var(--good-text) 40%, transparent); }
.trk.stopped, .trk.invalidated { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
.trk.awaiting { color: var(--warn-ink); background: var(--warn-bg); border-color: var(--warn); }
.trk.expired, .trk.time-exit, .trk.skipped, .trk.replaced { color: var(--ink-3); }
.trk-note { font-size: 10.5px; font-weight: 700; color: var(--warn-ink); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; }
.ageRow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.agechip { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line, #8884); color: var(--ink-3); background: transparent; }
.agechip.amber { color: var(--warn-ink); background: var(--warn-bg); border-color: var(--warn); }
.agechip.red { color: #fff; background: #c0392b; border-color: #c0392b; }
.agechip.big { font-size: 12.5px; padding: 4px 11px; }
.runline { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
.runline b.ok { color: inherit; } .runline b.amber { color: var(--warn-ink); } .runline b.red { color: #c0392b; }
.resetbtn { margin-left: 8px; font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line, #8886); background: transparent; color: inherit; cursor: pointer; }
.resetpanel { margin-top: 10px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line, #8886); font-size: 13px; }
.resetpanel[hidden] { display: none; }
.resetpanel ul { margin: 4px 0 8px; padding-left: 18px; }
.resetpanel textarea { width: 100%; min-height: 150px; font: 12px/1.45 ui-monospace, Consolas, monospace; box-sizing: border-box; background: transparent; color: inherit; border: 1px solid var(--line, #8886); border-radius: 8px; padding: 8px; }
.selbar { margin: 4px 0 10px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line, #8886); font-size: 13.5px; }
.selbar b { font-weight: 700; }
.rank { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 12px; }
.rank th, .rank td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line, #8883); white-space: nowrap; }
.rank th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.rank td.r, .rank th.r { text-align: right; }
.rank tr.clk { cursor: pointer; }
.flag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 4px; background: color-mix(in srgb, var(--ok, #2e8b57) 18%, transparent); border: 1px solid var(--ok, #2e8b57); cursor: help; }
.pricedin { margin: 8px 0 4px; }
.pricedin .num { font-size: 22px; font-weight: 800; }
.pricedin .num.ok { color: var(--ok, #2e8b57); } .pricedin .num.px { color: var(--warn-ink); } .pricedin .num.no { color: #c0392b; }
.pricedin .lab { font-size: 13px; font-weight: 600; margin-left: 6px; }
.pricedin .bd { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.pricedin .conf { font-size: 11.5px; color: var(--ink-3); margin-left: 6px; }
.pick.fold:not(.open) > :not(.hd):not(.readiness):not(.pricedin):not(.foldbtn) { display: none; }
.foldbtn { font: inherit; font-size: 12px; background: transparent; border: 0; color: var(--ink-3); cursor: pointer; padding: 4px 0 0; text-align: left; }
@media (max-width: 640px) { .rank .hide-m { display: none; } }
.tr-asof { margin-left: 4px; font-size: 11.5px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink-3); }
.tr-sum { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 0 0 12px; }
.tr-sum .sumchip { display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--chip); font-size: 12.5px; color: var(--ink-2); }
.tr-sum .sumchip b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.tr-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); margin-top: 12px; align-items: start; }
@media (max-width: 900px) { .tr-grid { grid-template-columns: 1fr; } }
.tr-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tr-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tr-table th { text-align: left; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); padding: 0 8px 6px 0; white-space: nowrap; }
.tr-table td { padding: 7px 8px 7px 0; border-top: 1px solid var(--grid); vertical-align: baseline; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tr-table th.n, .tr-table td.n { text-align: right; padding-right: 0; padding-left: 8px; }
.tr-table td.k { font-weight: 650; color: var(--ink); }
.tr-table tr.grp td { border-top: 0; padding-top: 12px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.tr-small { color: var(--ink-3); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.tr-table th.st, .tr-table td.st { padding-left: 16px; }
.tr-table td.st { white-space: normal; }
@media (max-width: 600px) {
  .hide-m { display: none; }
  .tr-table td, .tr-table th { padding-right: 6px; }
  .tr-table th.n, .tr-table td.n { padding-left: 6px; }
  .tr-table th.st, .tr-table td.st { padding-left: 8px; }
  .tr-table td.k { white-space: normal; }
}
.tr-head { margin: 0 0 8px; font-size: 13px; font-weight: 650; }
.tr-sub { margin: 0 0 10px; font-size: 12px; color: var(--ink-2); }
.tr-bars text { font-size: 10.5px; fill: var(--ink-3); }
.tr-bars .bv { font-size: 12px; font-weight: 700; fill: var(--ink); }
.tr-bars .bar { fill: var(--pos); }
.tr-bars .ph { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 3 3; }
.tr-bars .ax { stroke: var(--axis); stroke-width: 1; }
.tr-bars .gl { stroke: var(--grid); stroke-width: 1; }

/* ── Data health ── */
.stalechip { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: none; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn); vertical-align: 1px; }
.stalechip.failed { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit); border-color: var(--crit); }
.stalechip.pinned { background: var(--chip); color: var(--ink-2); border: 1px solid var(--border); }
.healthbar { margin-bottom: 12px; padding: 12px 14px; border-radius: 10px; font-size: 13px; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn); border-left-width: 4px; }
.healthbar.failed { background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--ink); border-color: var(--crit); }
.healthbar b { font-weight: 700; }
.healthbar ul { margin: 6px 0 0; padding-left: 18px; }
.healthbar li { margin: 2px 0; }
.empty { padding: 14px; border: 1px dashed var(--axis); border-radius: 10px; color: var(--ink-2); font-size: 13px; }

.foot { margin-top: 28px; font-size: 12px; color: var(--ink-3); }
.foot p { margin: 4px 0; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- ─────────────  DATA: the only thing the daily routine needs to rewrite  ───────────── -->
<script id="brief-data" type="application/json">__BRIEF_JSON__</script>

<script>
(function () {
  const D = JSON.parse(document.getElementById('brief-data').textContent);
  const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
  const fmt = (n, d = 2) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const sgn = (n, d = 2) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), d);
  const pctCls = (n) => n >= 0 ? 'up' : 'dn';
  const app = document.getElementById('app');

  /* ── Header ── */
  const hk = new Date().toLocaleString('en-GB', { timeZone: 'Asia/Hong_Kong', weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
  /* ── Data age (computed HERE, at view time: a static page cannot age itself at build time) ── */
  const CLOSED = new Set((D.calendar && D.calendar.closed) || []);
  const isTD = (d) => { const w = d.getUTCDay(); return w !== 0 && w !== 6 && !CLOSED.has(d.toISOString().slice(0, 10)); };
  const addDays = (d, n) => new Date(d.getTime() + n * 86400000);
  const etNow = (() => { const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date()); const g = (t) => f.find(x => x.type === t).value; return { date: new Date(g('year') + '-' + g('month') + '-' + g('day') + 'T00:00:00Z'), mins: (+g('hour') % 24) * 60 + +g('minute') }; })();
  const lastSessionNow = (() => { let d = etNow.date; if (isTD(d) && etNow.mins >= 16 * 60) return d; d = addDays(d, -1); while (!isTD(d)) d = addDays(d, -1); return d; })();
  const ageOf = (asOf) => { if (!asOf) return null; let d = new Date(asOf + 'T00:00:00Z'), n = 0; while (d < lastSessionNow) { d = addDays(d, 1); if (isTD(d)) n++; } return n; };
  const ageCls = (n) => n == null ? 'amber' : n >= 3 ? 'red' : n >= 2 ? 'amber' : '';
  const ageTxt = (n) => n == null ? 'age unknown' : n === 0 ? 'current' : n + (n === 1 ? ' session old' : ' sessions old');
  window.__briefAge = { ageOf, lastSession: lastSessionNow.toISOString().slice(0, 10) };       // exposed for the parity test
  const AGE_SECS = [['indices', 'Indices'], ['macro', 'Rates'], ['sectors', 'Sectors'], ['industries', 'Industries'], ['technical', 'Picks'], ['nearmiss', 'Near-miss'], ['catalysts', 'Catalysts']];
  const HS = (D.health && D.health.sections) || {};
  const ages = AGE_SECS.map(([k, l]) => ({ k, l, n: HS[k] ? ageOf(HS[k].asOf) : null })).filter(a => HS[a.k]);
  const scanAges = ages.filter(a => ['industries', 'technical', 'nearmiss'].includes(a.k)).map(a => a.n).filter(n => n != null);
  const scanN = scanAges.length ? Math.max(...scanAges) : null;
  const ageRow = `<div class="ageRow" id="ageRow"><span class="agechip big ${ageCls(scanN)}" title="Industry drill-down, technical picks and near-misses come from the last full scan; amber at 2+ sessions old, red at 3+">Scan: ${ageTxt(scanN)}</span>${ages.map(a => `<span class="agechip ${ageCls(a.n)}" title="${a.l} data as of ${HS[a.k].asOf}">${a.l}: ${ageTxt(a.n)}</span>`).join('')}</div>`;
  /* ── Last automated run: silent non-runs must be visible ── */
  const fmtHK = (iso) => new Date(iso).toLocaleString('en-GB', { timeZone: 'Asia/Hong_Kong', weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }) + ' HKT';
  const runLine = (() => {
    const la = D.runs && D.runs.lastAutomated;
    const grace = (D.runs && D.runs.schedule && D.runs.schedule.brief && D.runs.schedule.brief.graceMinutes) || 30;
    let exp = null;                                           // the most recent scheduled fire (12:00 UTC on a US trading day) that is more than `grace` minutes ago
    for (let i = 0; i < 10 && !exp; i++) { const d = addDays(new Date(new Date().toISOString().slice(0, 10) + 'T00:00:00Z'), -i); const fire = new Date(d.getTime() + 12 * 3600000); if (isTD(d) && fire.getTime() + grace * 60000 <= Date.now()) exp = fire; }
    const missed = !la || !exp ? !la && !!exp : new Date(la.at).getTime() < exp.getTime();
    const st = la ? la.status : 'unknown';
    const cls = missed || st === 'failed' ? 'red' : st === 'ok' ? 'ok' : 'amber';
    return `<div class="runline" id="runLine">Last automated run: <b class="${cls}">${la ? fmtHK(la.at) + ', status ' + st : 'not recorded yet'}</b>${la && la.seeded ? ' <span title="read from the routine run log, not written by the run itself">(from the run log)</span>' : ''}${missed ? ` · <b class="red">MISSED: the run due ${fmtHK(exp.toISOString())} has not been seen</b>` : ''}</div>`;
  })();
  const resetTxt = () => {
    const rp = D.resetPolicy || { clear: [], keep: [] };
    return 'Run a full "Reset scan" for the Pre-Market Swing Brief (repo megan878/premarket-brief, working folder brief-pipeline). Follow CLAUDE.md "Reset scan".\n\nCLEAR and rebuild:\n' + rp.clear.map(x => '- ' + x).join('\n') + '\n\nKEEP (never wiped by a reset):\n' + rp.keep.map(x => '- ' + x).join('\n') + '\n\nUse scripts/scan_fetch.py and scripts/scan_build.py, run the same validation and health checks as a normal run, show me the qualifying count, flags and priced-in scores, and ask before publishing. If a source fails, keep its last good data marked STALE. Never delete or rewrite data/picks.json records.\n\nShortcut: in a Claude Code session opened in that folder, just send /reset-scan';
  };
  app.append($(`<header class="top">
    <h1>Pre-Market Swing Brief</h1>
    <div class="meta">Data as of <b>${D.asOfLabel}</b> · built ${D.builtLabel} · HK now ${hk} · ${D.source}<button class="resetbtn" id="resetBtn" aria-expanded="false" aria-controls="resetPanel">Reset scan</button></div>
    ${ageRow}
    ${runLine}
    <div class="resetpanel" id="resetPanel" hidden>
      <b>This page cannot start a run.</b> Starting a scan needs a secret (a token) that must never be embedded in a shareable page, and the cloud routine has no WebFetch, so it can only refresh the automated sections anyway. A full scan runs in an interactive Claude Code session. Clicking "Copy" only copies the instruction below; nothing is sent or started.
      <p style="margin:8px 0 4px"><b>A reset clears and rebuilds:</b></p><ul>${((D.resetPolicy || {}).clear || []).map(x => `<li>${x}</li>`).join('')}</ul>
      <p style="margin:8px 0 4px"><b>and never touches:</b></p><ul>${((D.resetPolicy || {}).keep || []).map(x => `<li>${x}</li>`).join('')}</ul>
      <textarea id="resetText" readonly></textarea>
      <div style="margin-top:6px"><button class="resetbtn" id="resetCopy" style="margin-left:0">Copy instruction</button> <span id="resetMsg" style="font-size:12px"></span></div>
    </div>
  </header>`));
  document.getElementById('resetText').value = resetTxt();
  document.getElementById('resetBtn').addEventListener('click', () => { const pn = document.getElementById('resetPanel'); pn.hidden = !pn.hidden; document.getElementById('resetBtn').setAttribute('aria-expanded', String(!pn.hidden)); });
  document.getElementById('resetCopy').addEventListener('click', async () => {
    const ta = document.getElementById('resetText'), msg = document.getElementById('resetMsg');
    try { await navigator.clipboard.writeText(ta.value); msg.textContent = 'Copied. Paste it into a new Claude Code session.'; }
    catch (e) { ta.select(); msg.textContent = 'Select-all done: press Ctrl+C to copy.'; }
  });

  /* ── Data health banner (validation + carry-forward results) ── */
  const H = D.health || { status: 'ok', sections: {}, issues: [] };
  const stale = (k) => {
    const h = H.sections[k];
    if (!h || h.status === 'ok') return '';
    if (h.status === 'pinned') return `<span class="stalechip pinned" title="${(h.msg || '').replace(/"/g, '&quot;')}">PINNED · as of ${h.asOf}</span>`;
    return `<span class="stalechip ${h.status === 'failed' ? 'failed' : ''}" title="${(h.msg || '').replace(/"/g, '&quot;')}">${h.status === 'failed' ? 'NO DATA' : 'STALE · as of ' + h.asOf}</span>`;
  };
  if (H.status !== 'ok') {
    const LBL = { indices: 'Index & VIX quotes', macro: 'Rates & Fed', sectors: 'Sector strength', industries: 'Industry drill-down', technical: 'Technical picks', catalysts: 'Catalyst alerts', nearmiss: 'Near-miss watchlist', tracker: 'Pick tracker' };
    const rows = Object.entries(H.sections).filter(([, v]) => v.status !== 'ok' && v.status !== 'pinned').map(([k, v]) => `<li><b>${LBL[k] || k}</b> — ${v.status === 'failed' ? 'unavailable' : 'showing data from ' + v.asOf}. ${v.msg || ''}</li>`).join('');
    const extra = (H.issues || []).filter(i => i.level === 'warn').map(i => `<li>${i.msg}</li>`).join('');
    app.append($(`<div class="healthbar ${H.status === 'failed' ? 'failed' : ''}" role="alert"><b>${H.status === 'failed' ? 'Update failed' : 'Some data is not fresh'}</b> — the page is built from the last good copy where a source could not be reached; treat marked sections with care.<ul>${rows}${extra}</ul>${H.fetch && H.fetch.failed ? `<div style="margin-top:6px;font-size:12px">${H.fetch.failed} of ${H.fetch.calls} data calls failed this run.</div>` : ''}</div>`));
  }

  /* ── Notices ── */
  if (D.notices && D.notices.length) {
    app.append($(`<div class="notice" role="note">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 18.5 17h-17L10 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4M10 14.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div><b>Data gaps &amp; caveats</b><ul>${D.notices.map(n => `<li>${n}</li>`).join('')}</ul></div>
    </div>`));
  }

  /* ── Section 1: Market overview ── */
  const sec = $(`<section class="section"><h2><span class="n">1</span>Market overview${stale("indices")}${stale("macro")}</h2></section>`);
  app.append(sec);

  // index / regime strip
  const strip = $(`<div class="grid g-strip"></div>`);
  D.indices.forEach(ix => {
    const q = ix.q, isVix = ix.id === 'VIX';
    if (!q.yearLow) {  // proxy quote without range / averages (e.g. QQQ standing in for NDX)
      strip.append($(`<div class="card tile">
        <div class="sym">${ix.id} · ${ix.name}</div>
        <div class="val">${fmt(q.price)}</div>
        <div class="chg ${pctCls(q.pct)}"><span class="arr">${q.pct >= 0 ? '▲' : '▼'}</span>${sgn(q.pct)}% <span style="font-weight:500">(${sgn(q.change)})</span></div>
        <div class="chips"><span class="chip"><b>${ix.proxyFor} proxy</b> · ${ix.src}</span></div>
      </div>`));
      return;
    }
    const pos = Math.min(100, Math.max(0, (q.price - q.yearLow) / (q.yearHigh - q.yearLow) * 100));
    const vs = (ref) => (q.price / ref - 1) * 100;
    const arrow = q.pct >= 0 ? '▲' : '▼';
    // For VIX an up move is a risk-off signal, but keep the sign convention (blue=up, red=down) consistent across tiles.
    strip.append($(`<div class="card tile">
      <div class="sym">${ix.id} · ${ix.name}</div>
      <div class="val">${fmt(q.price, isVix ? 2 : 2)}</div>
      <div class="chg ${pctCls(q.pct)}"><span class="arr">${arrow}</span>${sgn(q.pct)}% <span style="font-weight:500">(${sgn(q.change)})</span></div>
      <div class="rng" title="Position in 52-week range">
        <div class="bar"><div class="dot" style="left:${pos}%"></div></div>
        <div class="lbl"><span>${fmt(q.yearLow, isVix ? 2 : 0)}</span><span>52w</span><span>${fmt(q.yearHigh, isVix ? 2 : 0)}</span></div>
      </div>
      <div class="chips">
        <span class="chip">vs 50d <b>${sgn(vs(q.ma50), 1)}%</b></span>
        <span class="chip">vs 200d <b>${sgn(vs(q.ma200), 1)}%</b></span>
      </div>
    </div>`));
  });
  if (D.macro) {
    const m = D.macro, d10 = m.y10 - m.y10prev;
    strip.append($(`<div class="card tile">
      <div class="sym">US10Y · Treasury</div>
      <div class="val">${m.y10.toFixed(2)}%</div>
      <div class="chg ${d10 >= 0 ? 'up' : 'dn'}"><span class="arr">${d10 >= 0 ? '▲' : '▼'}</span>${d10 >= 0 ? '+' : '−'}${Math.abs(d10 * 100).toFixed(0)} bp <span style="font-weight:500">on the day</span></div>
      <div class="chips"><span class="chip">2Y <b>${m.y2.toFixed(2)}%</b></span><span class="chip">30Y <b>${m.y30.toFixed(2)}%</b></span></div>
      <div class="chips"><span class="chip">Fed funds <b>${m.fed.range}</b></span></div>
    </div>`));
  }
  sec.append(strip);
  if (D.macro) {
    const m = D.macro, f = m.fed;
    const links = f.sources.map(x => `<a href="${x.u}" target="_blank" rel="noopener">${x.t}</a>`).join(' · ');
    const rateNote = (m.y10hist || []).length >= 5 ? '10Y direction feeds the regime score\'s rates check (5-day trend).' : 'Fed decision is context only; 10Y direction feeds the regime score when 5 days of history are available (not this run).';
    sec.append($(`<div class="macro" role="note"><b>Rates:</b> the Fed raised rates ${f.move} to ${f.range} on ${f.date} (${f.vote} vote; ${f.note}). The 10-year closed at ${m.y10.toFixed(2)}% on ${m.asOfShort || D.asOfLabel.replace(' close', '')} (${m.y10path}); curve 2Y ${m.y2.toFixed(2)}% · 10Y ${m.y10.toFixed(2)}% · 30Y ${m.y30.toFixed(2)}%.<span class="msrc">Fed decision: ${links} · yields: FMP treasury rates. ${rateNote}</span></div>`));
  }

  // regime + sector map
  const two = $(`<div class="grid g-two" style="margin-top:12px"></div>`);
  sec.append(two);

  // regime read (rule-based, fully transparent)
  const by = Object.fromEntries(D.indices.map(i => [i.id, i.q]));
  const checks = [
    ['S&P 500 above 50-day', by.SPX.price > by.SPX.ma50, `${sgn((by.SPX.price / by.SPX.ma50 - 1) * 100, 1)}%`],
    ['S&P 500 above 200-day', by.SPX.price > by.SPX.ma200, `${sgn((by.SPX.price / by.SPX.ma200 - 1) * 100, 1)}%`],
    ['Dow above 50-day', by.DJI.price > by.DJI.ma50, `${sgn((by.DJI.price / by.DJI.ma50 - 1) * 100, 1)}%`],
    ['Dow above 200-day', by.DJI.price > by.DJI.ma200, `${sgn((by.DJI.price / by.DJI.ma200 - 1) * 100, 1)}%`],
    ['Russell 2000 above 50-day', by.RUT.price > by.RUT.ma50, `${sgn((by.RUT.price / by.RUT.ma50 - 1) * 100, 1)}%`],
    ['Russell 2000 above 200-day', by.RUT.price > by.RUT.ma200, `${sgn((by.RUT.price / by.RUT.ma200 - 1) * 100, 1)}%`],

      const chips = [['ok', `Cap ${pk.cap}`], ['ok', 'Price &gt; $5']];
      chips.push([pk.topSector ? 'ok' : 'px', pk.topSector ? 'Top-3 sector' : `Outside top-3 sectors (${pk.sector})`]);
      const chipHtml = chips.map(c => `<span class="chip ${c[0]}">${c[1]}</span>`).join('');
      const src = pk.sources.map(s => `<a href="${s.u}" target="_blank" rel="noopener">${s.t}</a>`).join(' · ');
      cgrid.append($(`<article class="card pick cat" id="pick-${pk.tk}">
        <div class="hd"><div><span class="tk">${pk.tk}</span><span class="co">${pk.name}</span></div><div class="tags"><span class="kind cat">CATALYST</span>${flagHtml(pk.flags)}<span class="ind">${pk.industry} · ${pk.sector}</span></div></div>
        ${pricedHtml(pk)}
        <div class="catbox">
          <div class="ct"><b>${pk.ctype}</b><span>${pk.cdate}</span></div>
          <p>${pk.what}</p>
          <div class="src">Sources: ${src}</div>
        </div>
        ${bgHtml(pk.tk)}
        <div class="lv" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div><span class="k">Last price</span><span class="v">${price2(pk.px)}</span></div>
          <div><span class="k">Change</span><span class="v ${pctCls(pk.pct)}">${sgn(pk.pct)}%</span></div>
        </div>
        <div class="chk">${chipHtml}</div>
      </article>`));
    });
    sec2.append($(`<p class="foot" style="margin-top:10px">Alerts only: price/cap from FMP's live quote at build time, events sourced via web search. No entry/stop/target — compute and verify your own levels (or wait for the next interactive technical-scan refresh) before trading any of these. Not investment advice.</p>`));
  }


  /* ── Section 3: Watchlist ── */
  if (D.watch) {
    const sec3 = $(`<section class="section"><h2><span class="n">3</span>Watchlist</h2></section>`);
    app.append(sec3);
    const card = $(`<div class="card"></div>`);
    sec3.append(card);
    const pc = (v) => `<span class="pc ${v >= 0 ? 'up' : 'dn'}">${v >= 0 ? '▲' : '▼'} ${sgn(v)}%</span>`;
    const row = (name, html) => `<div class="wl-row"><div class="wl-h">${name}</div><div class="wl-items">${html}</div></div>`;
    // 1. indexes mirror the strip at the top
    const idx = D.indices.filter(i => i.q).map(i => `<span class="wi"><b>${i.id}</b><span class="px">${fmt(i.q.price)}</span>${pc(i.q.pct)}</span>`).join('');
    card.append($(row('Indexes', idx)));
    // 2-4. picks and near misses
    D.watch.groups.forEach(gp => {
      const items = gp.items.map(it => {
        const fl = it.flag ? `<span class="fl">${it.flag}</span>` : '';
        const inner = gp.near
          ? `<span class="top"><b>${it.tk}</b><span class="px">${price2(it.px)}</span>${pc(it.pct)}</span><small>${it.why}</small>`
          : `<b>${it.tk}</b><span class="px">${price2(it.px)}</span>${pc(it.pct)}${fl}`;
        const anchor = `#pick-${it.tk}`;
        return gp.near ? `<span class="wi nm">${inner}</span>` : `<a class="wi" href="${anchor}">${inner}</a>`;
      }).join('');
      card.append($(row(gp.name, items)));
    });
    card.append($(`<p class="wl-note">Snapshot at the ${D.asOfLabel}; it does not update by itself. Index rows are FMP (QQQ from web search). Technical-pick rows are pinned Finviz closes; catalyst-alert rows are FMP's live quote. Near misses come from the (pinned) technical scan and the catalyst rejects.</p>`));
  }

  /* ── Section 4: Track record (pick tracker). Everything shown is computed in tracker.py from the ledger; nothing hand-written. ── */
  if (D.tracker && (D.tracker.records || []).length) {
    const T = D.tracker, SL = T.stats.literal, SD = T.stats.disciplined, RULE = T.stats.rule || {};
    const trH = (H.sections && H.sections.tracker) || null;
    const trChip = trH && trH.status === 'pinned' ? `<span class="stalechip pinned" title="${(trH.msg || '').replace(/"/g, '&quot;')}">AWAITING DATA · outcomes as of ${trH.asOf}</span>` : '';
    const evalD = T.evaluatedThrough ? new Date(T.evaluatedThrough + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }) : null;
    const evalTxt = evalD ? `<span class="tr-asof">evaluated through ${evalD} close</span>` : `<span class="tr-asof">not evaluated yet</span>`;
    const sec4t = $(`<section class="section"><h2><span class="n">4</span>Track record${evalTxt}${trChip}</h2></section>`);
    app.append(sec4t);
    const fR = (v) => v == null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + 'R';
    const fP = (v) => v == null ? '—' : (v * 100).toFixed(0) + '%';
    const small = (s) => `<span class="tr-small">${s.label || 'n too small (<' + (T.stats.literal.minN || 20) + ')'}</span>`;
    const rcls = (v) => v == null ? '' : v >= 0 ? 'up' : 'dn';
    const when = (iso, approx) => {
      const d0 = new Date(iso), tz = { timeZone: 'Asia/Hong_Kong' };
      const t = d0.toLocaleString('en-GB', { ...tz, day: '2-digit', month: 'short' }) + `<span class="hide-m">, ${d0.toLocaleString('en-GB', { ...tz, hour: '2-digit', minute: '2-digit', hour12: false })}</span>`;
      return (approx ? `<span title="publish time approximate: the first commit holding this set; the real artifact publish was no later">≈ </span>` : '') + t;
    };
    const CHIP = TRK_LBL;
    const chipHtml = (c, r) => `<span class="trk ${c}">${CHIP[c] || c}${r != null ? ` <span class="r ${rcls(r)}">${fR(r)}</span>` : ''}</span>`;
    const o = SL.overall, od = SD.overall, IL = T.stats.invalidLevels || { n: 0, ids: [] };

    // summary
    const live = T.open.filter(x => x.status === 'live').length, wait = T.open.filter(x => x.status === 'waiting').length, awaitN = (T.awaitingData || []).length;
    sec4t.append($(`<div class="tr-sum">
      <span class="sumchip"><b>${o.picks}</b> pick${o.picks === 1 ? '' : 's'} · <b>${o.sets}</b> set${o.sets === 1 ? '' : 's'}</span>
      <span class="sumchip"><b>${o.closed}</b> closed</span>
      <span class="sumchip"><b>${live}</b> live${wait ? ` · <b>${wait}</b> waiting` : ''}${awaitN ? ` · <b>${awaitN}</b> awaiting data` : ''}</span>
      <span class="sumchip"><b>${o.invalidated}</b> invalidated · <b>${o.expired}</b> expired${o.skipped ? ` · <b>${o.skipped}</b> skipped` : ''}</span>
      ${IL.n ? `<span class="sumchip" title="${Object.entries(IL.reasons || {}).map(([k, v]) => k + ': ' + v).join('; ').replace(/"/g, '&quot;')}">published with invalid levels: <b>${IL.n}</b> <span class="tr-small">(${IL.ids.map(i => i.slice(11)).join(', ')}; excluded from all stats)</span></span>` : ''}
    </div>`));

    // literal vs disciplined
    const rowLD = (label, a, b) => `<tr><td class="k">${label}</td><td class="n">${a}</td><td class="n">${b}</td></tr>`;
    const rate = (s, f) => s.tooSmall ? small(s) : f(s);
    const cmp = $(`<div class="card">
      <h3 class="tr-head">Literal vs disciplined</h3>
      <p class="tr-sub"><b>Literal</b> is the record: every fill, including gap-ups above the zone. <b>Disciplined</b> refuses a fill whose open is above the zone top by ≥ ${RULE.adrMultiple}× ADR20% or more than ${RULE.maxPct}% — that counts as a skipped chase, not a trade.</p>
      <div class="tr-scroll"><table class="tr-table"><thead><tr><th></th><th class="n">Literal</th><th class="n">Disciplined</th></tr></thead><tbody>
        ${rowLD('Trades (filled)', o.trades, od.trades)}
        ${rowLD('Skipped chases', '—', od.chaseSkipped)}
        ${rowLD('Closed', o.closed, od.closed)}
        ${rowLD('Win rate', o.tooSmall ? small(o) : fP(o.winRate), od.tooSmall ? small(od) : fP(od.winRate))}
        ${rowLD('Avg R', o.tooSmall ? '—' : fR(o.avgR), od.tooSmall ? '—' : fR(od.avgR))}
        ${rowLD('Avg days held', o.tooSmall ? '—' : o.avgDaysHeld.toFixed(1), od.tooSmall ? '—' : od.avgDaysHeld.toFixed(1))}
      </tbody></table></div>
    </div>`);

    // readiness band vs win rate (literal): small bar chart, n on every bar
    const bands = ['<50', '50-69', '>=70'], BL = { '<50': '< 50', '50-69': '50–69', '>=70': '≥ 70' };
    const bw = 64, gap = 22, W = 40 + bands.length * (bw + gap), Hc = 150, base = 108, top = 22, bh = base - top;
    let bars = '';
    bands.forEach((b, i) => {
      const s = SL.byReadinessBand[b] || { picks: 0, closed: 0, sets: 0, tooSmall: true, winRate: null };
      const x = 34 + i * (bw + gap), cx = x + bw / 2;
      if (s.tooSmall) bars += `<rect class="ph" x="${x}" y="${base - 26}" width="${bw}" height="26" rx="3"/><text x="${cx}" y="${base - 11}" text-anchor="middle">n/a</text>`;
      else { const h = Math.max(2, s.winRate * bh); bars += `<rect class="bar" x="${x}" y="${base - h}" width="${bw}" height="${h}" rx="3"/><text class="bv" x="${cx}" y="${base - h - 5}" text-anchor="middle">${fP(s.winRate)}</text>`; }
      bars += `<text x="${cx}" y="${base + 14}" text-anchor="middle">${BL[b]}</text><text x="${cx}" y="${base + 28}" text-anchor="middle">n=${s.closed} closed</text><text x="${cx}" y="${base + 41}" text-anchor="middle">${s.picks} pick${s.picks === 1 ? '' : 's'}</text>`;
    });
    const chart = $(`<div class="card">
      <h3 class="tr-head">Readiness band vs win rate</h3>
      <p class="tr-sub">Closed trades only. A dashed bar means fewer than ${SL.minN} closed trades in that band — no rate is shown.</p>
      <svg class="tr-bars" viewBox="0 0 ${W} ${Hc + 20}" width="100%" role="img" aria-label="Win rate by readiness band, with the number of closed trades behind each bar">
        <line class="gl" x1="30" x2="${W - 4}" y1="${top}" y2="${top}"/><line class="gl" x1="30" x2="${W - 4}" y1="${(top + base) / 2}" y2="${(top + base) / 2}"/>
        <line class="ax" x1="30" x2="${W - 4}" y1="${base}" y2="${base}"/>
        <text x="26" y="${top + 4}" text-anchor="end">100%</text><text x="26" y="${(top + base) / 2 + 4}" text-anchor="end">50%</text><text x="26" y="${base + 4}" text-anchor="end">0</text>
        ${bars}
      </svg>
    </div>`);
    const g1 = $(`<div class="tr-grid"></div>`);
    g1.append(cmp, chart);
    sec4t.append(g1);

    // open trades
    const openRows = T.open.map(x => `<tr><td class="k">${x.ticker}</td><td>${when(x.publishedAt, x.approx)}</td><td class="n">${x.readiness == null ? '—' : x.readiness}</td>
      <td class="st">${chipHtml(x.status, x.openR)}${x.chased ? ' <span class="trk-note" title="filled above the entry zone">chased</span>' : ''}${x.chaseSkip ? ' <span class="trk-note" title="the disciplined view skips this fill">skip</span>' : ''}</td>
      <td class="n">${x.fillPrice == null ? '—' : price2(x.fillPrice)}</td><td class="n hide-m">${x.lastClose == null ? '—' : price2(x.lastClose)}</td><td class="n hide-m">${price2(x.stop)}</td><td class="n hide-m">${price2(x.target)}</td></tr>`).join('');
    sec4t.append($(`<div class="card" style="margin-top:12px"><h3 class="tr-head">Open trades</h3>
      ${T.open.length ? `<div class="tr-scroll"><table class="tr-table"><thead><tr><th>Ticker</th><th>Published <span class="hide-m">(HKT)</span></th><th class="n">Ready</th><th class="st">Status · open R</th><th class="n">Fill</th><th class="n hide-m">Last</th><th class="n hide-m">Stop</th><th class="n hide-m">Target</th></tr></thead><tbody>${openRows}</tbody></table></div>` : `<div class="empty">No open trades.</div>`}
    </div>`));

    // last 20 closed
    const clRows = T.closed20.map(x => `<tr><td class="k">${x.ticker}</td><td>${when(x.publishedAt, x.approx)}</td><td class="n">${x.readiness == null ? '—' : x.readiness}</td>
      <td class="st">${chipHtml(x.result)}${x.chased ? ' <span class="trk-note" title="filled above the entry zone">chased</span>' : ''}${x.chaseSkip ? ' <span class="trk-note" title="the disciplined view skips this fill">skip</span>' : ''}</td>
      <td class="n"><span class="${rcls(x.r)}" style="font-weight:700">${fR(x.r)}</span></td></tr>`).join('');
    sec4t.append($(`<div class="card" style="margin-top:12px"><h3 class="tr-head">Last 20 closed <span class="tr-small">· ${T.closed20.length} so far</span></h3>
      ${T.closed20.length ? `<div class="tr-scroll"><table class="tr-table"><thead><tr><th>Ticker</th><th>Published <span class="hide-m">(HKT)</span></th><th class="n">Ready</th><th class="st">Result</th><th class="n">R</th></tr></thead><tbody>${clRows}</tbody></table></div>` : `<div class="empty">No closed trades yet.</div>`}
    </div>`));

    // splits
    const split = (title, obj) => `<tr class="grp"><td colspan="5">${title}</td></tr>` + Object.entries(obj).map(([k, s]) =>
      `<tr><td class="k">${({ '<50': '< 50', '50-69': '50–69', '>=70': '≥ 70' })[k] || k}</td><td class="n" style="white-space:nowrap">${s.picks} <span class="tr-small">(${s.sets} set${s.sets === 1 ? '' : 's'})</span></td><td class="n">${s.closed}</td>
       ${s.tooSmall ? `<td class="n" colspan="2">${small(s)}</td>` : `<td class="n">${fP(s.winRate)}</td><td class="n">${fR(s.avgR)}</td>`}</tr>`).join('');
    sec4t.append($(`<div class="card" style="margin-top:12px"><h3 class="tr-head">Splits</h3>
      <p class="tr-sub">Literal ledger. "Sets" = distinct publishes: three semiconductors from one day are one independent sample, not three. Win = hit target, or exit above the fill.</p>
      <div class="tr-scroll"><table class="tr-table"><thead><tr><th></th><th class="n">Picks</th><th class="n">Closed</th><th class="n">Win rate</th><th class="n">Avg R</th></tr></thead><tbody>
        ${split('Readiness band', SL.byReadinessBand)}${split('Regime at publish', SL.byRegime)}${split('Sector', SL.bySector)}${split('Scoring version', SL.byScoringVersion)}${split('Fill', SL.byFill)}${split('Selection rules', SL.bySelectionVersion || {})}${split('Strength flags', SL.byFlags || {})}${split('Stop distance at publish (tight = within 0.5× ADR20% of the close)', SL.byStopDistance || {})}
      </tbody></table></div>
    </div>`));
    sec4t.append($(`<p class="foot" style="margin-top:10px">Every pick is recorded once per publish and followed to an outcome by replaying daily OHLC (entry triggers when the day's high reaches the entry, filled at the open if it gaps above; stop and target use the same bar, with the stop assumed first when both are hit; expires after 10 sessions untriggered; time-exit at the close of session 20). The cloud routine has no price history, so outcomes refresh only in an interactive session; until then a record reads "Awaiting data". Percentages appear only once a bucket has ${SL.minN} closed trades. Not investment advice.</p>`));
  }

  /* ── Section 5: Catalyst Playbook (static reference — not data, never refreshed) ── */
  const sec4 = $(`<section class="section"><h2><span class="n">5</span>Reference</h2></section>`);
  app.append(sec4);
  sec4.append($(`<details class="playbook">
    <summary>Catalyst Playbook <span class="hint">— how to act on each catalyst type</span></summary>
    <div class="pb-body">
      <div class="pb-col">
        <h4>Catalyst types to trade</h4>
        <ul class="pb-types">
          <li>Earnings beat + raised guidance</li>
          <li>Major contract / deal / backlog win</li>
          <li>Analyst upgrade, target &gt;15% above price</li>
          <li>Product launch / regulatory approval</li>
          <li>Index inclusion (S&amp;P / Nasdaq adds — passive buying pressure)</li>
          <li>Sympathy moves (sector leader reports, peers run)</li>
          <li>Short-squeeze setups (high short interest + fresh catalyst)</li>
        </ul>
      </div>
      <div class="pb-col">
        <h4>Decision rules</h4>
        <div class="pb-rule"><span class="pb-ic warn">⏱</span><div><b>Scheduled &amp; binary events</b> (earnings, FDA) — trade the <b>reaction</b>, not the anticipation. Don't hold through the print: that's a coin-flip gap.</div></div>
        <div class="pb-rule"><span class="pb-ic ok">✓</span><div><b>Best lane — the reaction trade:</b> enter once the post-news move <b>holds</b> above a clear level on expanding volume, ideally day 2+ follow-through (gap-and-go continuation / episodic pivot).</div></div>
        <div class="pb-rule"><span class="pb-ic crit">✕</span><div><b>Always gate on conviction</b> — no catalyst trade in a company facing a bad structural situation, however good the pop looks.</div></div>
      </div>
      <div class="pb-col">
        <h4>Sizing rules</h4>
        <table class="pb-sizing">
          <tr><td class="pb-sz half">Half size, max</td><td>Binary event still ahead (earnings/FDA not yet reported)</td></tr>
          <tr><td class="pb-sz full">Full size</td><td>Post-reaction continuation, confirmed on volume</td></tr>
          <tr><td class="pb-sz half">Size down</td><td>Unverified or thin catalyst (e.g. an unnamed licensee)</td></tr>
        </table>
      </div>
    </div>
  </details>`));

  /* ── Footer ── */
  app.append($(`<footer class="foot">
    <p>SPX, DJI, RUT, VIX: FMP quotes, ${D.asOf} after the US close; regime read uses each index's own 50/200-day averages as reported by FMP.</p>
    <p>QQQ and sector strength (11-sector ranking): web search, cap-weighted, 1-month — refreshed every run. Industry drill-down and technical picks: Finviz, pinned to the last interactive refresh (WebFetch is not available to the automated routine — see the PINNED chips above). Not investment advice.</p>
    <p>Catalyst alerts: events and dates from web search (two sources each); price, % change and market cap from the FMP company profile at build time — not a verified tape reaction. Company snapshot for catalyst tickers is cap + description only (FMP); revenue/EPS/next-earnings need FMP's statements/earnings-calendar endpoints, blocked on the free plan, or an interactive refresh. Pinned technical picks keep their full snapshot from the last interactive run.</p>
    <p>Rates: 10-year and curve from FMP treasury-rates (${D.asOfLabel.replace(' close', '')}). Fed decision from web search summaries, confirmed across at least two outlets.</p>
  </footer>`));
})();
</script>
</body>
</html>
